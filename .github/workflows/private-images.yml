name: Build Jesvi iOS (TWRP)
run-name: >-
  Jesvi iOS ${{ inputs.release_tag || inputs.version || 'release.conf' }} ·
  ${{ inputs.s20 && 'S20 ' || '' }}${{ inputs.s20plus && 'S20+ ' || '' }}${{ inputs.s20ultra && 'S20 Ultra ' || '' }}
  · writes ${{ inputs.writes }}
# Same build.sh release as local builds; public image output requires explicit opt-in.
on:
  workflow_dispatch:
    inputs:
      s20:
        description: Galaxy S20 (x1s ZIP, G980F + G981B)
        type: boolean
        default: true
      s20plus:
        description: Galaxy S20+ (y2s ZIP, G986B + G985F)
        type: boolean
        default: false
      s20ultra:
        description: Galaxy S20 Ultra (z3s ZIP, G988B, first-boot profile)
        type: boolean
        default: false
      runner:
        description: GitHub macOS 15 (hosted), GitHub macOS 26, or a provisioned private Mac
        type: choice
        options: [hosted, macos-26, self-hosted]
        default: hosted
      mode:
        description: Install mode (fresh erases userdata; update requires existing iOS data)
        type: choice
        options: [from-release.conf, choose, fresh, update]
        default: from-release.conf
      writes:
        description: Override WRITES (installs proceed after 10 seconds; fresh erases userdata)
        type: choice
        options: [from-release.conf, 'true', 'false']
        default: from-release.conf
        # y2s is a first-install-only target: from-release.conf is upgraded to
        # WRITES=true below so a dispatched build produces a flashable TWRP ZIP.
      outputs:
        description: Override release.conf OUTPUTS (e.g. "twrp restore tar"); empty keeps the file's value
        type: string
        default: ''
      version:
        description: Version label in the ZIP name (e.g. 0.4-beta1); empty keeps release.conf VERSION
        type: string
        default: ''
      data_gb:
        description: iOS data volume size in GB (16-112) or all of userdata; S20 only (S20+ and S20 Ultra always use all)
        type: choice
        options: [from-release.conf, all, '32', '64', '96']
        default: from-release.conf
      disable_mods:
        description: Optional features to leave out, space separated (see devices/exynos990/mods, e.g. "island softpasscode")
        type: string
        default: ''
      keep_days:
        description: How many days GitHub keeps the downloadable ZIPs (a release build always keeps them 90)
        type: choice
        options: ['7', '1', '3', '14', '30', '90']
        default: '7'
      release_tag:
        description: Add the ticked phones to GitHub release TAG (e.g. v0.4); empty = no release
        type: string
        default: ''
      release_state:
        description: draft = you press Publish on GitHub; publish = public at once
        type: choice
        options: [draft, publish]
        default: draft
permissions:
  contents: read
# No workflow-wide queue: runs and phones build in parallel (public repos get 5 macOS runners).
# Only the release step is serialized per tag (job "release" below).
jobs:
  configuration:
    name: 1. Check settings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      s20: ${{ steps.pick.outputs.s20 }}
      family: ${{ steps.pick.outputs.family }}
      y2s_family: ${{ steps.pick.outputs.y2s_family }}
    steps:
      - name: Pick the phones to build
        id: pick
        env:
          S20: ${{ inputs.s20 }}
          S20PLUS: ${{ inputs.s20plus }}
          S20ULTRA: ${{ inputs.s20ultra }}
        run: |
          t=()
          [ "$S20" = true ] && t+=('"x1slte"')
          [ "$S20PLUS" = true ] && t+=('"y2s"')
          [ "$S20ULTRA" = true ] && t+=('"z3s"')
          [ ${#t[@]} -gt 0 ] || { echo '::error::Tick at least one phone.'; exit 1; }
          echo "targets=[$(IFS=,; echo "${t[*]}")]" >> "$GITHUB_OUTPUT"
          echo "s20=$S20" >> "$GITHUB_OUTPUT"
          fam=()
          [ "$S20PLUS" = true ] && fam+=('"y2s"')
          [ "$S20ULTRA" = true ] && fam+=('"z3s"')
          echo "family=[$(IFS=,; echo "${fam[*]}")]" >> "$GITHUB_OUTPUT"
          [ "$S20PLUS" = true ] || [ "$S20ULTRA" = true ] && f=true || f=false
          echo "y2s_family=$f" >> "$GITHUB_OUTPUT"
          echo "Phones: ${t[*]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check private release configuration
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILDS_ENABLED: ${{ vars.ENABLE_PRIVATE_IMAGE_BUILDS }}
          PUBLIC_IMAGES_ENABLED: ${{ vars.ENABLE_PUBLIC_IMAGE_BUILDS }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run the full iOS package build on the default branch."
            exit 1
          fi
          if [[ "$REPO_PRIVATE" != true && "$PUBLIC_IMAGES_ENABLED" != true ]]; then
            echo "::error::Public image artifacts require explicit ENABLE_PUBLIC_IMAGE_BUILDS=true approval."
            exit 1
          fi
          if [[ "$BUILDS_ENABLED" != true ]]; then
            echo "::error::Provision the reviewed private inputs and set ENABLE_PRIVATE_IMAGE_BUILDS=true."
            exit 1
          fi
  y2s-board:
    name: "2. S20+ / S20 Ultra: UEFI loader"
    needs: configuration
    # S20+ and S20 Ultra share the y2s UEFI (Mu-y2s) and boot DTBH.
    if: needs.configuration.outputs.y2s_family == 'true' && inputs.runner != 'self-hosted'
    uses: ./.github/workflows/y2s-firmware.yml
    # The encrypted board-input handoff key lives in the private-images environment.
    secrets: inherit
  # The S20 needs no UEFI build: it starts at once, in parallel with the S20+ family's Mu job.
  candidate-s20:
    name: "3. Build ${{ matrix.target == 'x1slte' && 'Galaxy S20 (x1s)' || (matrix.target == 'y2s' && 'Galaxy S20+ (y2s)' || 'Galaxy S20 Ultra (z3s)') }}"
    needs: configuration
    if: needs.configuration.outputs.s20 == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [x1slte]
    environment: private-images
    runs-on: &phone-runner ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "macOS", "exynos990-private"]') || (inputs.runner == 'macos-26' && 'macos-26' || 'macos-15') }}
    timeout-minutes: 360
    env: &phone-env
      RELEASE_OUT: dist/release-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      PYTHONUNBUFFERED: '1'
      SHARE: '1'
    steps: &phone-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check camera profile source generation
        run: python3 tools/camera/test_profile_sources.py
      - name: Check generated APFS with the runner's native checker
        run: |
          mkdir -p "$RUNNER_TEMP/apfs-smoke"
          printf 'filesystem check\n' > "$RUNNER_TEMP/apfs-smoke/probe"
          python3 tools/apfs/mkapfs.py -o "$RUNNER_TEMP/apfs-smoke.apfs" "Test=$RUNNER_TEMP/apfs-smoke"
          /sbin/fsck_apfs -n "$RUNNER_TEMP/apfs-smoke.apfs"
      - name: Check hosted board inputs
        if: inputs.runner != 'self-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUTS_TAG: ${{ vars.PRIVATE_INPUTS_TAG }}
          INPUTS_SHA256: ${{ vars.PRIVATE_INPUTS_SHA256 }}
          INPUTS_AGE_KEY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          if [[ -z "$INPUTS_TAG" || ! "$INPUTS_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set PRIVATE_INPUTS_TAG and PRIVATE_INPUTS_SHA256 to the release tag and SHA-256 of board-inputs.tar.gz."
            exit 1
          fi
          asset=board-inputs.tar.gz
          if [[ -n "$INPUTS_AGE_KEY" ]]; then asset+=.age; fi
          if ! found=$(gh release view --repo "$GH_REPO" --json assets \
              --jq '.assets[].name' -- "$INPUTS_TAG") ||
              ! grep -Fxq "$asset" <<< "$found"; then
            echo "::error::The configured release must be visible to this workflow and contain $asset."
            exit 1
          fi
      # The pinned Touch ID extractor uses Capstone 4, which imports distutils.
      - name: Select Python for the hosted build
        if: inputs.runner != 'self-hosted'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Provision disposable GitHub compute
        if: inputs.runner != 'self-hosted'
        run: bash ci/setup-hosted-images.sh
      # Caches. Public-source outputs (toolchains, OpenH264, the kernel tree) are cached plainly;
      # the Apple extraction is encrypted with the private-images age key, because forks' PR
      # runs can read this repository's default-branch caches. Every key is a checksum of what
      # the output is built from, and the build re-verifies (extraction receipt, source key).
      - name: Cache keys
        if: inputs.runner != 'self-hosted'
        id: keys
        run: |
          echo "kernel=$(python3 tools/release/source_key.py)" >> "$GITHUB_OUTPUT"
          echo "apple=$(cd tools/release && python3 -c 'from pathlib import Path; from extraction import recipe; print(recipe(Path("../..").resolve()))')" >> "$GITHUB_OUTPUT"
      - name: Cache toolchains and OpenH264
        if: inputs.runner != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/toolchains
            .cache/release-deps/openh264-source
          key: deps-${{ inputs.runner }}-${{ hashFiles('ci/sources.lock.json', 'tools/release/go_toolchain.py', 'ci/build-openh264.sh') }}
      - name: Cache the kernel tree
        if: inputs.runner != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/release-kernel/${{ steps.keys.outputs.kernel }}
          key: kernel-${{ inputs.runner }}-${{ steps.keys.outputs.kernel }}
      - name: Restore the encrypted Apple extraction
        if: inputs.runner != 'self-hosted'
        id: apple-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apple.tar.zst.age
          key: apple-${{ steps.keys.outputs.apple }}
      - name: Decrypt the Apple extraction
        if: inputs.runner != 'self-hosted' && steps.apple-cache.outputs.cache-hit == 'true'
        env:
          AGE_IDENTITY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AGE_IDENTITY" | age --decrypt --identity - "$RUNNER_TEMP/apple.tar.zst.age" | zstd -dc | tar -xf - -C sysimage
          rm "$RUNNER_TEMP/apple.tar.zst.age"
          python3 tools/release/extraction.py verify && echo 'Apple extraction restored from cache'
      - name: Validate source and native recovery backend
        run: |
          bash ci/check.sh
          bash ci/check-recovery.sh
      - name: Stage private input snapshot
        if: inputs.runner == 'self-hosted'
        env:
          PRIVATE_INPUTS_ROOT: ${{ vars.PRIVATE_INPUTS_ROOT }}
        run: |
          if [[ -z "$PRIVATE_INPUTS_ROOT" || ! -f "$PRIVATE_INPUTS_ROOT/inputs/private-inputs.lock.json" ]]; then
            echo "::error::Set PRIVATE_INPUTS_ROOT to the reviewed snapshot on the macOS runner."
            exit 1
          fi
          python3 tools/release/private_store.py stage --snapshot "$PRIVATE_INPUTS_ROOT"
          echo 'HACKIOS_IMAGE_CACHE=/var/cache/exynos990/private-images' >> "$GITHUB_ENV"
      - name: Download reviewed board inputs from this repository
        if: inputs.runner != 'self-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUTS_TAG: ${{ vars.PRIVATE_INPUTS_TAG }}
          INPUTS_SHA256: ${{ vars.PRIVATE_INPUTS_SHA256 }}
          INPUTS_AGE_KEY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          archive="$RUNNER_TEMP/board-inputs/board-inputs.tar.gz"
          mkdir -p "$(dirname "$archive")"
          if [[ -n "$INPUTS_AGE_KEY" ]]; then
            gh release download --repo "$GH_REPO" --pattern board-inputs.tar.gz.age --dir "$(dirname "$archive")" -- "$INPUTS_TAG"
            printf '%s\n' "$INPUTS_AGE_KEY" | age --decrypt --identity - --output "$archive" "$archive.age"
            rm "$archive.age"
          else
            gh release download --repo "$GH_REPO" --pattern board-inputs.tar.gz --dir "$(dirname "$archive")" -- "$INPUTS_TAG"
          fi
          python3 tools/release/hosted_inputs.py unpack \
            --archive "$archive" --root "$GITHUB_WORKSPACE" --sha256 "$INPUTS_SHA256"
          rm "$archive"
      - name: Fetch encrypted S20+ board inputs (Mu UEFI + boot DTBH)
        if: (matrix.target == 'y2s' || matrix.target == 'z3s') && inputs.runner != 'self-hosted'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: y2s-board-inputs
          path: ${{ runner.temp }}/y2s
      - name: Stage the S20+ Mu image and stock DTBH
        if: (matrix.target == 'y2s' || matrix.target == 'z3s') && inputs.runner != 'self-hosted'
        env:
          INPUTS_AGE_KEY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$INPUTS_AGE_KEY" || {
            echo '::error::Set HOSTED_BOARD_INPUTS_AGE_KEY in the private-images environment to decrypt the y2s board inputs.'
            exit 1
          }
          mkdir -p inputs/y2s
          printf '%s\n' "$INPUTS_AGE_KEY" | age --decrypt --identity - "$RUNNER_TEMP/y2s/y2s-board-inputs.tar.gz.age" |
            tar -xzf - -C inputs/y2s Mu-y2s.img stock-boot-dtbh.img SHA256SUMS
          (cd inputs/y2s && shasum -a 256 -c SHA256SUMS)
      - name: Build everything release.conf asks for
        env:
          WRITES_INPUT: ${{ inputs.writes }}
          OUTPUTS_INPUT: ${{ inputs.outputs }}
          MODE_INPUT: ${{ inputs.mode }}
          TARGET_INPUT: ${{ matrix.target }}
          VERSION_INPUT: ${{ inputs.version }}
          DATA_INPUT: ${{ inputs.data_gb }}
          MODS_INPUT: ${{ inputs.disable_mods }}
        run: |
          test ! -e "$RELEASE_OUT"
          args=(--set "OUT=$RELEASE_OUT" --set "TARGETS=$TARGET_INPUT")
          if [ "$TARGET_INPUT" = y2s ] || [ "$TARGET_INPUT" = z3s ]; then
            if [ "$MODE_INPUT" != from-release.conf ] && [ "$MODE_INPUT" != fresh ]; then
              echo "::error::$TARGET_INPUT TWRP is first-install only; choose mode from-release.conf or fresh."
              exit 1
            fi
            # Measured y2s image geometry: full userdata, first-install only.
            args+=(--set IOS_DATA_GB=all --set MODE=fresh)
            # release.conf defaults to a read-only preflight for safety. This is
            # an explicitly dispatched release build: ship a flashable ZIP unless
            # the operator deliberately asked for a preflight.
            if [ "$WRITES_INPUT" = from-release.conf ]; then args+=(--set WRITES=true); fi
          fi
          if [ "$MODE_INPUT" != from-release.conf ] && [ "$TARGET_INPUT" = x1slte ]; then args+=(--set "MODE=$MODE_INPUT"); fi
          if [ "$WRITES_INPUT" != from-release.conf ]; then args+=(--set "WRITES=$WRITES_INPUT"); fi
          if [ -n "$OUTPUTS_INPUT" ]; then args+=(--set "OUTPUTS=$OUTPUTS_INPUT"); fi
          if [ -n "$VERSION_INPUT" ]; then args+=(--set "VERSION=$VERSION_INPUT"); fi
          if [ "$DATA_INPUT" != from-release.conf ] && [ "$TARGET_INPUT" = x1slte ]; then args+=(--set "IOS_DATA_GB=$DATA_INPUT"); fi
          if [ -n "$MODS_INPUT" ]; then args+=(--set "MODS_DISABLE=$MODS_INPUT"); fi
          {
            echo '### Build settings'
            echo '| Setting | Value |'
            echo '|---|---|'
            for a in "${args[@]}"; do [ "$a" = --set ] || echo "| ${a%%=*} | \`${a#*=}\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          ./build.sh release --dry-run "${args[@]}"
          ./build.sh release "${args[@]}"
          (
            cd "$RELEASE_OUT"
            shasum -a 256 -c ./*.sha256
          )
      - name: Encrypt the Apple extraction for later runs
        if: inputs.runner != 'self-hosted' && steps.apple-cache.outputs.cache-hit != 'true'
        id: apple-pack
        env:
          AGE_IDENTITY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          set -euo pipefail
          python3 tools/release/extraction.py verify
          recipient=$(printf '%s\n' "$AGE_IDENTITY" | age-keygen -y)
          tar -C sysimage -cf - extraction.json rootfs cryptex cryptex-app 20F66__iPhone10,3_6 system.manifest var.skel |
            zstd -T0 -3 | age -r "$recipient" -o "$RUNNER_TEMP/apple.tar.zst.age"
      - name: Save the encrypted Apple extraction
        if: steps.apple-pack.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apple.tar.zst.age
          key: ${{ steps.apple-cache.outputs.cache-primary-key }}
      - name: Retain deduplicated image objects privately
        if: inputs.runner == 'self-hosted'
        env:
          PRIVATE_STORE_ROOT: ${{ vars.PRIVATE_STORE_ROOT }}
        run: |
          test -n "$PRIVATE_STORE_ROOT"
          for bundle in dist/candidate-*/; do
            [ -d "$bundle" ] || continue
            python3 tools/release/private_store.py retain --bundle "$bundle" --store "$PRIVATE_STORE_ROOT"
          done
      - name: Upload this run's verified packages
        id: packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jesvi-ios-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_OUT }}/
          compression-level: 0
          retention-days: ${{ inputs.release_tag != '' && 90 || fromJSON(inputs.keep_days) }}
          if-no-files-found: error
      - name: Small release files (Restore ZIP, checksums, installer size)
        if: inputs.release_tag != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meta"
          for z in "$RELEASE_OUT"/Jesvi-iOS_*.zip; do wc -c < "$z" | tr -d ' ' > "$RUNNER_TEMP/meta/$(basename "$z").size"; done
          cp "$RELEASE_OUT"/*.sha256 "$RELEASE_OUT"/Jesvi-iOS-Restore_*.zip "$RUNNER_TEMP/meta/"
      - name: Upload the small release files
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-meta-${{ matrix.target }}
          path: ${{ runner.temp }}/meta/
          retention-days: 7
          if-no-files-found: error
      - name: Link to the verified packages
        env:
          PACKAGE_URL: ${{ steps.packages.outputs.artifact-url }}
        run: printf '[Download package ZIPs and SHA-256 checksums](%s)\n' "$PACKAGE_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-build-logs-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/local-build/*.log
            out/kernel/build.log
            out/experimental/y2s/build.log
          retention-days: 7
          if-no-files-found: ignore
  # S20+ and S20 Ultra: same steps (YAML anchors above), after their shared Mu-y2s job.
  candidate:
    name: "3. Build ${{ matrix.target == 'x1slte' && 'Galaxy S20 (x1s)' || (matrix.target == 'y2s' && 'Galaxy S20+ (y2s)' || 'Galaxy S20 Ultra (z3s)') }}"
    needs: [configuration, y2s-board]
    if: >-
      ${{ !cancelled() && needs.configuration.outputs.y2s_family == 'true' &&
      needs.y2s-board.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.configuration.outputs.family) }}
    environment: private-images
    runs-on: *phone-runner
    timeout-minutes: 360
    env: *phone-env
    steps: *phone-steps
  release:
    name: 4. Add to the GitHub release
    needs: [configuration, candidate-s20, candidate]
    # Runs once after every phone, even if one failed: finished phones are still added.
    if: ${{ !cancelled() && inputs.release_tag != '' && needs.configuration.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-meta-*
          path: meta
      - name: Add each phone in turn
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          STATE: ${{ inputs.release_state }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(meta/release-meta-*)
          [ ${#dirs[@]} -gt 0 ] || { echo '::error::No phone finished; nothing to release.'; exit 1; }
          for d in "${dirs[@]}"; do
            bash tools/release/publish-release.sh "$TAG" "$d" "" draft | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [ "$STATE" = publish ]; then gh release edit "$TAG" --draft=false; fi
