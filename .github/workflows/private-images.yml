name: Private TWRP release
# Only enable in a PRIVATE build repository with disposable macOS workers.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Install mode (fresh erases userdata; update requires existing iOS data)
        type: choice
        options: [from-release.conf, choose, fresh, update]
        default: from-release.conf
      writes:
        description: Override WRITES (installs proceed after 45 seconds; fresh erases userdata)
        type: choice
        options: [from-release.conf, 'true', 'false']
        default: from-release.conf
      outputs:
        description: Override release.conf OUTPUTS (e.g. "twrp restore tar"); empty keeps the file's value
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: private-image-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PRIVATE_IMAGE_BUILDS == 'true'
    environment: private-images
    runs-on: [self-hosted, macOS, exynos990-private]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate source and native recovery backend
        run: |
          bash ci/check.sh
          bash ci/check-recovery.sh
      - name: Stage private input snapshot
        env:
          PRIVATE_INPUTS_ROOT: ${{ vars.PRIVATE_INPUTS_ROOT }}
        run: |
          test -n "$PRIVATE_INPUTS_ROOT"
          python3 tools/release/private_store.py stage --snapshot "$PRIVATE_INPUTS_ROOT"
      - name: Build everything release.conf asks for
        env:
          HACKIOS_IMAGE_CACHE: /var/cache/exynos990/private-images
          WRITES_INPUT: ${{ inputs.writes }}
          OUTPUTS_INPUT: ${{ inputs.outputs }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          args=(--set OUT=dist/release)
          if [ "$MODE_INPUT" != from-release.conf ]; then args+=(--set "MODE=$MODE_INPUT"); fi
          if [ "$WRITES_INPUT" != from-release.conf ]; then args+=(--set "WRITES=$WRITES_INPUT"); fi
          if [ -n "$OUTPUTS_INPUT" ]; then args+=(--set "OUTPUTS=$OUTPUTS_INPUT"); fi
          ./build.sh release --dry-run "${args[@]}"
          ./build.sh release "${args[@]}"
          ls dist/release/*.zip
      - name: Retain deduplicated image objects privately
        env:
          PRIVATE_STORE_ROOT: ${{ vars.PRIVATE_STORE_ROOT }}
        run: |
          test -n "$PRIVATE_STORE_ROOT"
          for bundle in dist/candidate-*/; do
            [ -d "$bundle" ] || continue
            python3 tools/release/private_store.py retain --bundle "$bundle" --store "$PRIVATE_STORE_ROOT"
          done
      - name: Downloadable ZIP in this private workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jesvi-ios-${{ github.sha }}-${{ github.run_id }}
          path: dist/release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
