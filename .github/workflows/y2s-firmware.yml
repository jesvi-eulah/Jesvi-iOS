name: Build S20+ 5G UEFI and board inputs
on:
  workflow_dispatch:
  workflow_call:
    # The caller passes these with `secrets: inherit`; declaring them here keeps
    # the handoff explicit and makes a missing secret a visible configuration
    # problem instead of an empty age key.
    secrets:
      HOSTED_BOARD_INPUTS_AGE_KEY:
        description: age identity used to hand Mu-y2s.img and the stock DTBH to the macOS build
        required: false
permissions:
  contents: read
jobs:
  firmware:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    environment: private-images
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the Exynos 990 boot device tree
        # The boot-image DTB is the generic Exynos 990 tree shared by the S20
        # and S20+ (board specifics live in dtbo). It is byte-identical to the
        # one in the S20's stock boot image and to the y2s.dtb shipped by
        # stormtroopxyz/y2sios, so no Samsung firmware download (or IMEI) is
        # needed. Pinned by commit and SHA-256.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          trees="$RUNNER_TEMP/stock/trees"
          mkdir -p "$trees"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --output "$trees/stock-boot-dtb.img" \
            https://raw.githubusercontent.com/stormtroopxyz/y2sios/68fe2e922a52917ed851c1499e394fe5436365b5/uefi/Resources/DTBs/y2s.dtb
          echo 'ffcad4d6011d108329f801abb9ca9ee48cffd6ccfc2704ea47d5e8f24507e22b  '"$trees/stock-boot-dtb.img" | sha256sum --check
          # Stock DTBH = 64-byte Samsung table header + the single tree.
          { printf 'd7b7ab1e000533cc0000002000000020000000010000002000000800000000000005338c00000040000000000000000000000000ff0000000000000000000000' | xxd -r -p
            cat "$trees/stock-boot-dtb.img"; } > "$trees/stock-boot-dtbh.img"
          echo '9596875233beaf42706c3427aded6b981f4844e4f05b75ddd5f390c70c51b276  '"$trees/stock-boot-dtbh.img" | sha256sum --check
      - name: Build Mu-Silicium for y2s
        run: |
          set -euo pipefail
          overlay="$GITHUB_WORKSPACE/devices/exynos990/y2s/legacy/uefi-y2s"
          git clone --filter=blob:none --no-checkout https://github.com/Project-Silicium/Mu-Silicium.git "$RUNNER_TEMP/mu"
          cd "$RUNNER_TEMP/mu"
          git checkout --detach cc64daf0e05b7533995e4fd01e0f5043ec26c137
          git submodule update --init --depth 1
          cp -R "$overlay/Platforms/Samsung/y2sPkg" Platforms/Samsung/
          cp "$overlay/Resources/Configs/y2s.toml" Resources/Configs/
          cp "$RUNNER_TEMP/stock/trees/stock-boot-dtb.img" Resources/DTBs/y2s.dtb
          cp "$overlay/BootManagerLib/XnuLoader."{c,h} Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/
          git apply "$overlay/y2s.patch"
          python3 -m venv "$RUNNER_TEMP/mu-venv"
          source "$RUNNER_TEMP/mu-venv/bin/activate"
          bash setup_env.sh -p apt
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          python3 build_uefi.py -d y2s -r RELEASE
          python3 - <<'PYTHON'
          from pathlib import Path
          data = Path('Mu-y2s.img').read_bytes()
          slot = data[0x100870:0x180870]
          if not data.startswith(b'ANDROID!') or slot != b'\xff' * 0x80000:
              raise SystemExit('Mu boot image does not contain the expected y2s payload slot')
          PYTHON
          cp Mu-y2s.img "$RUNNER_TEMP/stock/trees/"
      - name: Encrypt the board inputs for the macOS build
        env:
          AGE_IDENTITY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AGE_IDENTITY" || {
            echo '::error::Set HOSTED_BOARD_INPUTS_AGE_KEY in the private-images environment to encrypt the y2s board inputs.'
            exit 1
          }
          cd "$RUNNER_TEMP/stock"
          (cd trees && sha256sum Mu-y2s.img stock-boot-dtbh.img > SHA256SUMS)
          recipient=$(printf '%s\n' "$AGE_IDENTITY" | age-keygen -y)
          tar -C trees -czf - Mu-y2s.img stock-boot-dtbh.img SHA256SUMS |
            age -r "$recipient" -o "$RUNNER_TEMP/y2s-board-inputs.tar.gz.age"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: y2s-board-inputs
          path: ${{ runner.temp }}/y2s-board-inputs.tar.gz.age
          if-no-files-found: error
          retention-days: 7
