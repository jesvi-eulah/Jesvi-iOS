name: Build S20+ 5G board inputs
on:
  workflow_dispatch:
  workflow_call:
    # The caller passes these with `secrets: inherit`; declaring them here keeps
    # the handoff explicit and makes a missing secret a visible configuration
    # problem instead of an empty password in samloader/age.
    secrets:
      Y2S_FUS_IMEI:
        description: IMEI used with Samsung's firmware service (optional when a stock ZIP URL is set)
        required: false
      Y2S_STOCK_FIRMWARE_URL:
        description: HTTPS URL of the verified SM-G986B XSG stock firmware ZIP
        required: false
      HOSTED_BOARD_INPUTS_AGE_KEY:
        description: age identity used to hand Mu-y2s.img and the stock DTBH to the macOS build
        required: false
permissions:
  contents: read
jobs:
  firmware:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    environment: private-images
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch SM-G986B stock firmware
        env:
          DEVICE_IMEI: ${{ secrets.Y2S_FUS_IMEI }}
          STOCK_FIRMWARE_URL: ${{ secrets.Y2S_STOCK_FIRMWARE_URL }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir stock
          if [[ -n "$STOCK_FIRMWARE_URL" ]]; then
            curl --fail --silent --location --proto '=https' --proto-redir '=https' \
              --retry 3 --output stock/firmware.zip -- "$STOCK_FIRMWARE_URL" ||
              { echo "::error::Could not download the stock ZIP from Y2S_STOCK_FIRMWARE_URL."; exit 1; }
            printf '%s  %s\n' '8936bf40d04d85f556e7c4f35a070384' stock/firmware.zip | md5sum --check
            exit 0
          fi
          if [[ ! "$DEVICE_IMEI" =~ ^[0-9]{15}$ ]]; then
            echo "::error::Set Y2S_FUS_IMEI or Y2S_STOCK_FIRMWARE_URL in private-images."
            exit 1
          fi
          # Samsung switched FUS to the 2026 "Smart" scheme. The pinned client
          # returns an empty nonce; carry the reviewed protocol/key patch with
          # the checkout so the download works on a fresh hosted runner.
          git clone --filter=blob:none https://github.com/martinetd/samloader.git "$RUNNER_TEMP/samloader-src"
          git -C "$RUNNER_TEMP/samloader-src" checkout --detach 0d724ce27b88915f61111313ce406a12c5c25a4a
          git -C "$RUNNER_TEMP/samloader-src" apply "$GITHUB_WORKSPACE/tools/y2s/samloader-2026-fus.patch"
          python3 -m venv "$RUNNER_TEMP/samloader"
          "$RUNNER_TEMP/samloader/bin/pip" install "$RUNNER_TEMP/samloader-src"
          cmd=("$RUNNER_TEMP/samloader/bin/samloader" -m SM-G986B -r XSG -i "$DEVICE_IMEI")
          version=G986BXXSNHYB1/G986BOXBNHYB1/G986BXXSNHYB1/G986BXXSNHYB1
          "${cmd[@]}" download -v "$version" -O stock
          shopt -s nullglob
          inputs=(stock/*.enc[24])
          [[ ${#inputs[@]} == 1 ]]
          file=${inputs[0]}
          "${cmd[@]}" decrypt -v "$version" -V "${file: -1}" -i "$file" -o stock/firmware.zip
          rm -- "$file"
      - name: Extract stock board trees
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age lz4
          cd "$RUNNER_TEMP/stock"
          mapfile -t ap < <(unzip -Z1 firmware.zip | grep -E '(^|/)AP_G986BXXSNHYB1[^/]*\.tar\.md5$')
          [[ ${#ap[@]} == 1 ]]
          unzip -p firmware.zip "${ap[0]}" | tar -xO -f - boot.img.lz4 | lz4 -dc > boot.img
          python3 "$GITHUB_WORKSPACE/tools/y2s/stock-info.py" boot-trees boot.img trees
          rm -- firmware.zip boot.img
      - name: Build Mu-Silicium for y2s
        run: |
          set -euo pipefail
          overlay="$GITHUB_WORKSPACE/devices/exynos990/y2s/legacy/uefi-y2s"
          git clone --filter=blob:none --no-checkout https://github.com/Project-Silicium/Mu-Silicium.git "$RUNNER_TEMP/mu"
          cd "$RUNNER_TEMP/mu"
          git checkout --detach cc64daf0e05b7533995e4fd01e0f5043ec26c137
          git submodule update --init --depth 1
          cp -R "$overlay/Platforms/Samsung/y2sPkg" Platforms/Samsung/
          cp "$overlay/Resources/Configs/y2s.toml" Resources/Configs/
          cp "$RUNNER_TEMP/stock/trees/stock-boot-dtb.img" Resources/DTBs/y2s.dtb
          cp "$overlay/BootManagerLib/XnuLoader."{c,h} Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/
          git apply "$overlay/y2s.patch"
          python3 -m venv "$RUNNER_TEMP/mu-venv"
          source "$RUNNER_TEMP/mu-venv/bin/activate"
          bash setup_env.sh -p apt
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          python3 build_uefi.py -d y2s -r RELEASE
          python3 - <<'PYTHON'
          from pathlib import Path
          data = Path('Mu-y2s.img').read_bytes()
          slot = data[0x100870:0x180870]
          if not data.startswith(b'ANDROID!') or slot != b'\xff' * 0x80000:
              raise SystemExit('Mu boot image does not contain the expected y2s payload slot')
          PYTHON
          cp Mu-y2s.img "$RUNNER_TEMP/stock/trees/"
      - name: Encrypt the board inputs for the macOS build
        env:
          AGE_IDENTITY: ${{ secrets.HOSTED_BOARD_INPUTS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AGE_IDENTITY" || {
            echo '::error::Set HOSTED_BOARD_INPUTS_AGE_KEY in the private-images environment to encrypt the y2s board inputs.'
            exit 1
          }
          cd "$RUNNER_TEMP/stock"
          (cd trees && sha256sum Mu-y2s.img stock-boot-dtbh.img > SHA256SUMS)
          recipient=$(printf '%s\n' "$AGE_IDENTITY" | age-keygen -y)
          tar -C trees -czf - Mu-y2s.img stock-boot-dtbh.img SHA256SUMS |
            age -r "$recipient" -o "$RUNNER_TEMP/y2s-board-inputs.tar.gz.age"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: y2s-board-inputs
          path: ${{ runner.temp }}/y2s-board-inputs.tar.gz.age
          if-no-files-found: error
          retention-days: 7
