# Samsung Galaxy S20 Ultra 5G (SM-G988B, z3s) -- Exynos 990. Derived from y2s.conf: same 12 GB map, Mu-y2s UEFI, DTBH and geometry.
# Values below were measured on an S20+ (y2s) on 2026-11-22; z3s reuses them until a tester reports (docs/devices/z3s.md).
# evidence: docs/release/device-evidence-y2s.md. This is a development config,
# not a qualified board adapter: the loader and a fresh-only TWRP image/flash
# adapter exist, but installer_validated stays false until qualification is
# recorded. Values marked VERIFY still need boot-time proof.
# IMPORTANT: the phone runs a ported S24+ ROM. Every offset and image-geometry
# value must be re-derived from SM-G986B stock firmware and PIT; ROM dumps are
# only cross-checks and must never be used as final offsets.
NAME="Samsung Galaxy S20 Ultra 5G (z3s, SM-G988B)"
KIND=phone
SOC="Samsung Exynos 990 (S5E9830)"
BOOTLOADER="G988BXXSNHYB1"

# --- boot chain (Samsung) ---------------------------------------------------------------------------
# sboot -> recovery (69,009,408 B) -> BootShim -> Mu-Silicium y2sPkg -> xnuloader -> XNU.
UEFI_TARGET=y2s
FD_BASE=0xE8000000              # legacy y2s UEFI FD base (VERIFY against the built y2sPkg)
FD_SIZE=0x200000
# The loader stages payloads at FD + 0x100000 = 0xE8100000 (max 0x80000).
# The legacy 0xF0000000 window overlaps cp_rmem and must not be used here.
PAYLOAD_BASE=0xE8100000
# s3cfb.bootloaderfb=0xf1000000 on the phone; xnuloader selects platform_y2s by this.
FB_BASE=0xF1000000
GIC_V2=1                        # GICv2: dist 0x10101000, CPU IF 0x10102000 (VERIFY at boot)
# stock-boot-dtb.img is the inner raw FDT used by Mu-Silicium; the Android boot
# header needs the full Samsung DT table (d7b7ab1e) from stock boot.img instead.
DTBH_FILE=${DTBH_FILE:-inputs/y2s/stock-boot-dtbh.img}
WIFI_ATH11K=0                   # Broadcom BCM4375 on PCIe, not ath11k/WCN6750

# --- memory (12 GB, measured DT; do not reuse x1slte's 8 GB map) ------------------------------------
# Banks: 0x80000000+0x3AB00000, 0xC1200000+0x1EE00000, 0xE1900000+0x1E700000,
# and 20 x 0x20000000 banks from 0x880000000 to 0xB00000000 (11.875 GiB total).
EL2_EARLYMEM=0xAFE800000        # 24 MiB, DT reserved el2_earlymem
ABOX_RMEM=0xF8000000            # 42 MiB below 4 GiB (DT reserved abox_rmem)
# cp_rmem at 0xF0000000 (8 MiB) and cp_rmem_2 at 0xD0000000 (64 MiB) are modem windows.

# --- storage (stock G986BXXSNHYB1 PIT + super metadata; verified 2026-11-22) -------------------------
SUPER_PARTITION_SIZE=9437184000     # stock PIT METADATA = 0x232800000 (the phone's by-name "super")
SUPER_GROUP_SIZE=9432989696         # stock LP group_basic max = 0x232400000
# Stock super.img LP metadata: system 0x100000..0x174194000, vendor ..0x1cb4a1000,
# product ..0x216a77000, odm ..0x216f26000. 1 MiB-aligned tail starts at 0x217000000,
# leaving 0x1b800000 (440 MiB) before super's end (0x232800000).
# The ROM's 0x1EA584000, x1slte's 0x1E8B04000 and legacy 0x184B00000 are NOT y2s offsets.
SUPER_TAIL_START=0x217000000
BOOT_PARTITION_SIZE=61865984        # stock PIT BLCMD = live by-name boot
RECOVERY_PARTITION_SIZE=69009408    # stock PIT BOOT = live by-name recovery
# Updates are flashed from the loader's Log access (USB) menu with ./y2s.sh
# rflash / tflash; there is no TWRP bootstrap or stash in y2s.

# --- board parts (runtime + active DTBO 7 evidence; cross-check stock DTBO) ---------------------------
PANEL="s6e3hab (z3s variant; 1440x3200 like y2s)"
TOUCH="sec_ts (z3s firmware; unconfirmed)"
WIFI_FW=bcmdhd_sta.bin_b1
PMIC_GAUGE="MAX77705"
HAPTIC_CHIP=""
TORCH_CHIP=""
SENSORHUB=""
CAMERA_MODULES=""                # z3s: HM1 108 MP + others; no camera profile yet

# --- what the run needs -----------------------------------------------------------------------------
DEFAULT_SECS=900
# Build-only bring-up values, derived from the stock G986B super LP metadata:
# system.apfs is staged into super[0..0x174200000) (the stock system extent ends
# at 0x174194000; 0x174200000 is the next 1 MiB boundary and the vendor start).
# This is NOT installer qualification; the loader must still be proven on hardware.
ROOT_PART=super
ROOT_SUPER_OFF=0
ROOT_SUPER_LEN=0x174200000
# The stock PIT's SPU (live by-name userdata) remainder. Used only as the loader's
# write window for /private/var in a development image; not an installer profile.
USERDATA_PARTITION_SIZE=116253523968
BOOTARGS="$(cat devices/exynos990/z3s/z3s.cmdline)"
# y2s has no rootless /var/jb prefix. userland/build-gpu-y2s.sh exports
# ACCOUNT_RELAY=0 so the inherited x1slte account-store job is not installed;
# x1slte's build.sh default (on) is unchanged.
USERLAND_VARS=""
