# Jesvi-iOS release preferences, read by `./build.sh release` and GitHub Actions.
# KEY=value lines; `#` starts a comment. Override any key for one run with
# `./build.sh release --set KEY=value` or the environment variable JESVI_<KEY>.

# File names: <NAME>_<VERSION>_<YYYYMMDD>_<target>.zip and <NAME>-Restore_...
NAME=Jesvi-iOS
VERSION=0.1.1

# Device profiles in devices/exynos990/<id>/device.json. Targets without a
# measured profile (status "unmaintained") are reported and skipped.
# Exynos 990 family: x1slte (S20), y2s (S20+), z3s (S20 Ultra), c1s (Note20), c2s (Note20 Ultra), r8s (S20 FE)
TARGETS=x1slte

# Outputs, any of:
#   twrp      iOS installer ZIP (TWRP; from iOS or any Android ROM)
#   preflight read-only checking ZIP (never writes)
#   restore   Jesvi-iOS-Restore ZIP (back to Android; needs no Apple inputs)
#   tar       plain image bundle (boot/recovery/system + manifest) for developers
OUTPUTS=twrp restore

# iOS install mode: fresh (default, erases existing data) | choose | update
# Write-enabled install ZIPs proceed after a 45-second cancel window, including on existing iOS.
# iOS's data size in GB (decimal, as Settings shows it): 64 leaves the rest of userdata untouched (later: dual boot);
# all = the whole partition (~116 GB). Changing it needs a fresh install (MODE=fresh or choose on a new phone).
IOS_DATA_GB=64
MODE=fresh

# true = install ZIPs write after a 45-second cancel window (Volume Up proceeds early).
# Restore ZIPs still require a Volume Up hold; their timeout cancels.
# false = every ZIP is a preflight that only checks the phone.
WRITES=false

# Optional mods (devices/exynos990/mods/*) to leave out, e.g. "island softpasscode".
# `./build.sh target x1slte --format mods` lists what a target gets.
MODS_DISABLE=

# A verified candidate directory (from an earlier build) to package. Empty: run
# the full local build first (macOS, private Apple inputs, ~25 GiB free).
BUNDLE=

# Where finished files go (under dist/).
OUT=dist/release
