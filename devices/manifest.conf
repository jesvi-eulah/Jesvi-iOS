# devices/manifest.conf: the devices and SoC layers this tree holds, in HakiOS's manifest format, so that upstream's
# tools/hakios-device.py can read them and a device can later be split into a hakios-device-<name> repository.

soc exynos990
	path        devices/exynos990

device x1slte
	path        devices/exynos990/x1slte

device y2s
	path        devices/exynos990/y2s
