# Galaxy S20+ 5G (SM-G986B, Exynos 990, board id y2s).
# Measured on the owner's phone 2026-11-22; see docs/release/device-evidence-y2s.md.
# The running donor ROM reports SM-S926B: only the bootloader, vendor/odm props
# and device tree identify this board. Never allowlist the donor ROM's model.
# Storage offsets/geometry below are derived from the stock G986BXXSNHYB1 PIT and
# super.img metadata; the running ROM's by-name map and lpdump are cross-checks only.
TARGET_NAME="Galaxy S20+ 5G (SM-G986B)"
TARGET_CODENAME="y2s"
TARGET_STATUS="development"
TARGET_ASSERT_MODEL="SM-G986B"
TARGET_ASSERT_BOOTLOADER="G986BXXSNHYB1"
# The TWRP ZIP is a first-install image: it erases Android/iOS data and writes a
# clean HFSX data volume. Updates go only through the loader's Log access (USB)
# menu (./y2s.sh rflash / tflash), never through this ZIP.
TARGET_RECOVERY_PRODUCTS="y2s"

TARGET_RAM_GB="12"
TARGET_STORAGE_GB="128"
TARGET_DISPLAY_RESOLUTION="1440x3200"
TARGET_DISPLAY_REFRESH_RATES="60,120"
TARGET_DISPLAY_CUTOUT="center"
# Active panel: s6e3hab_hubble2_a3_s0_default_osc_96_5m_rev03, ID 0x811104
# (lcdtype=8458500), resolved from active DTBO 7 + dmesg find_panel_lut.
TARGET_PANEL="s6e3hab"
TARGET_TOUCH="sec_ts @0x48 (i2c-7)"
TARGET_MODEM="5g"
TARGET_WIFI_CHIP="bcm4375"
TARGET_NFC_CHIP="SLSI"
# Fingerprint module not observed in probe/active DTBO; leave unclaimed.
TARGET_FINGERPRINT=""
TARGET_HAS_SPEN="false"
TARGET_HAS_ESIM="true"
# Camera modules are known from active DTBO 7; the S20 XNU camera path is now
# asked to come up on y2s too (cam=5 /dev/redwood-camera, cam_s20=1 real sensors).
# cam_s20_y2s=1 powers the CSIS PMU domain and S2MPS22 LDO5S/LDO6S rails that
# y2s leaves cold at boot; x1slte does not set it.
TARGET_CAMERA="s20"
TARGET_HAPTIC_CHIP="cs40l25"
# Torch/flash is in the s2mpb02 PMIC node; sensor hub is SSP BCM4773.
TARGET_TORCH_CHIP="s2mpb02"
TARGET_SENSORHUB="bcm4773"

TARGET_BOARD_CONF="common/devices/y2s.conf"
# Legacy UEFI starting point: devices/exynos990/y2s/legacy/uefi-y2s/.
# Installer profile exists for first installs, but no hardware EXIT=0 run has
# qualified it yet; installer_validated stays false in device.json.
TARGET_UEFI=""
TARGET_FIRMWARE="fw-wifi fw-sound fw-haptic fw-camera"
# The boot-tested y2s line keeps the x1slte-style board drivers (touch, haptic,
# sensor hub, torch and Wi-Fi PCIe/NVRAM). The shared softpasscode mod is NOT
# enabled here: y2s has no software bag on existing data volumes and softpasscode=1
# hangs SpringBoard at the Apple logo. cam_s20=1 comes from TARGET_CAMERA above.
TARGET_BOOTARGS="touch_ts=1 haptic=5 shub=6 torch=3 wifi_pcie=4 wifi_nvram=1 wifi_pcie_wait=3 cam=5 cam_s20_y2s=1"
TARGET_DISABLE_MODS="softpasscode"

TARGET_SUPER_GROUP_NAME="group_basic"
TARGET_SUPER_PARTITION_SIZE="9437184000"
TARGET_SUPER_GROUP_SIZE="9432989696"
