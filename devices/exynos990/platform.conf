# Exynos 990 platform: shared by every target (like ExtremeROM's platform/exynos990).
# Plain KEY="value" lines; bash can source this file.
PLATFORM_SOC="exynos990"
PLATFORM_XNU_TAG="xnu-8796.121.2"
PLATFORM_IOS_BUILD="20F66"
PLATFORM_GIC="2"
PLATFORM_PROTECTED_PARTITIONS="efs sec_efs radio modem bootloader sboot param up_param dtbo vbmeta vbmeta_samsung"

# Boot-args of drivers every 990 phone shares: battery/PMIC, USB, Mali/Metal, display
# engine, UFS storage and the iOS root, Bluetooth, ABOX sound, CPU idle/DVFS.
PLATFORM_BOOTARGS="bms=1 bms_wdt=1 bms_ilim=1 bms_hv=1 usb_gadget=5 usb_ecm=1 usb_mux=1 mali=1 mali_irq=1 cpumask=0xff dvfs=2 cpuidle=1 jit_flush=1 fb_threads=6 fb_te=1 fb_bl=1 fb_scaler=1 fb_mode=1 fb_mode_lpref=1 metal=1 mediamtl=1 camtl=1 ufs=2 ufs_native=1 ufs_root=@ROOT_PART@:@ROOT_OFF@:@ROOT_LEN@ ufs_userdata_all=1 ufs_write=1 ufs_tw=1 var_hfs=1 bt=1 snd=1 autounlock=0"
# Stock boot-image device tree: the generic Exynos 990 tree, byte-identical on every
# 990 phone checked (S20 own backup, S20+ via stormtroopxyz/y2sios, S20 Ultra via
# N1709/z3sios). Model-specific hardware lives in dtbo, which we never use, so one
# pinned copy serves every target's UEFI and DTBH. No Samsung firmware download needed.
PLATFORM_BOOT_DTB_URL="https://raw.githubusercontent.com/stormtroopxyz/y2sios/68fe2e922a52917ed851c1499e394fe5436365b5/uefi/Resources/DTBs/y2s.dtb"
PLATFORM_BOOT_DTB_SHA256="ffcad4d6011d108329f801abb9ca9ee48cffd6ccfc2704ea47d5e8f24507e22b"
# Stock DTBH = this 64-byte Samsung table header + the tree above.
PLATFORM_BOOT_DTBH_HEADER="d7b7ab1e000533cc0000002000000020000000010000002000000800000000000005338c00000040000000000000000000000000ff0000000000000000000000"
PLATFORM_BOOT_DTBH_SHA256="9596875233beaf42706c3427aded6b981f4844e4f05b75ddd5f390c70c51b276"
