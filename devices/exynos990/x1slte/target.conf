# Galaxy S20 LTE (SM-G980F). ExtremeROM covers it under its x1s target.
TARGET_NAME="Galaxy S20 LTE"
TARGET_CODENAME="x1slte"
TARGET_STATUS="development"
# One ZIP for the whole S20 board: G980F installs, G981B (5G sibling) gets the read-only check.
TARGET_PACKAGE_NAME="x1s"
TARGET_ASSERT_MODEL="SM-G980F"
TARGET_ASSERT_BOOTLOADER="G980FXXSNHYB7"
TARGET_RECOVERY_PRODUCTS="x1s x1slte"

TARGET_RAM_GB="8"
TARGET_STORAGE_GB="128"
TARGET_DISPLAY_RESOLUTION="1440x3200"
TARGET_DISPLAY_REFRESH_RATES="60,120"
TARGET_DISPLAY_CUTOUT="center"
TARGET_PANEL="s6e3hab"
TARGET_TOUCH="sec_ts"
TARGET_MODEM="lte"
TARGET_WIFI_CHIP="bcm4375"
TARGET_NFC_CHIP="SLSI"
TARGET_FINGERPRINT="ultrasonic"
TARGET_HAS_SPEN="false"
TARGET_HAS_ESIM="true"
TARGET_CAMERA="s20"
TARGET_HAPTIC_CHIP="cs40l25"
TARGET_TORCH_CHIP="s2mpb02"
TARGET_SENSORHUB="bcm_sensorhub_a1"

TARGET_BOARD_CONF="common/devices/x1slte.conf"
TARGET_UEFI="https://github.com/jesvi-eulah/g980f-uefi (x1slte-uefi artifact)"
TARGET_FIRMWARE="fw-wifi fw-sound fw-sensors fw-haptic"
# Board drivers: touch, haptics, sensor hub, torch, Broadcom PCIe Wi-Fi, camera pipeline.
TARGET_BOOTARGS="touch_ts=1 haptic=5 shub=6 torch=3 wifi_pcie=4 wifi_nvram=1 wifi_pcie_wait=3 cam=5 touchid=1"

TARGET_SUPER_GROUP_NAME="group_basic"
TARGET_SUPER_PARTITION_SIZE="9437184000"
TARGET_SUPER_GROUP_SIZE="9432989696"
