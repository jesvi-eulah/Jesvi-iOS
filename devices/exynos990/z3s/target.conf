# Galaxy S20 Ultra 5G (SM-G988B, Exynos 990, board id z3s).
# Built on the S20+ (y2s) image path: same 12 GB memory map, s6e3hab panel family at
# 1440x3200, sec_ts touch, BCM4375 Wi-Fi, MAX77705, identical stock boot DTB and
# super/boot/recovery geometry (ExtremeROM target/z3s; the original Exynos 990 iOS
# bring-up, N1709/z3sios, ran on this phone). First-boot profile: the board drivers
# that differ or are unconfirmed on z3s (camera, flash, sensor hub, haptics) stay off.
TARGET_INHERIT="y2s"
TARGET_NAME="Galaxy S20 Ultra (SM-G988B)"
TARGET_CODENAME="z3s"
TARGET_STATUS="development"
TARGET_ASSERT_MODEL="SM-G988B"
# Assumed from the S20 family's last release; any G988B bootloader is accepted (same-model rule).
TARGET_ASSERT_BOOTLOADER="G988BXXSNHYB1"
TARGET_RECOVERY_PRODUCTS="z3s"
TARGET_PACKAGE_NAME="z3s"
TARGET_RAM_GB="12"
TARGET_STORAGE_GB="128"
TARGET_DISPLAY_RESOLUTION="1440x3200"
TARGET_DISPLAY_REFRESH_RATES="60,120"
TARGET_PANEL="s6e3hab"
TARGET_MODEM="5g"
TARGET_FINGERPRINT="ultrasonic"
TARGET_HAS_ESIM="true"
TARGET_CAMERA=""
TARGET_HAPTIC_CHIP=""
TARGET_TORCH_CHIP=""
TARGET_SENSORHUB=""
TARGET_BOARD_CONF="common/devices/z3s.conf"
TARGET_BOOTARGS="touch_ts=1 wifi_pcie=4 wifi_nvram=1 wifi_pcie_wait=3"
TARGET_DISABLE_MODS="softpasscode"
TARGET_SUPER_GROUP_NAME="group_basic"
TARGET_SUPER_PARTITION_SIZE="9437184000"
TARGET_SUPER_GROUP_SIZE="9432989696"
